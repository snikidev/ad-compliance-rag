[project]
name = "ad-compliance"
version = "0.1.0"
description = "RAG showcase that checks gambling ad copy against UK CAP/BCAP under-18s guidance."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "snikidev" }]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "typer>=0.15",
]

[project.scripts]
ad-compliance = "ad_compliance.cli:app"

[project.urls]
Homepage = "https://github.com/snikidev/llamaindex-python-rag"
Repository = "https://github.com/snikidev/llamaindex-python-rag"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ad_compliance"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
