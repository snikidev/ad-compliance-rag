[project]
name = "ad-compliance"
version = "0.1.0"
description = "RAG showcase that checks gambling ad copy against UK CAP/BCAP under-18s guidance."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "snikidev" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "fastembed>=0.5",
  "fastmcp>=2.0",
  "lancedb>=0.21",
  "llama-index-core>=0.14,<0.15",
  "llama-index-embeddings-azure-openai>=0.4",
  "llama-index-embeddings-fastembed>=0.5",
  "llama-index-embeddings-ollama>=0.8",
  "llama-index-embeddings-openai>=0.6",
  "llama-index-llms-azure-openai>=0.4",
  "llama-index-llms-ollama>=0.7",
  "llama-index-llms-openai>=0.6",
  "llama-index-vector-stores-lancedb>=0.4",
  "pandas>=3.1.1",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "streamlit>=1.40",
  "typer>=0.15",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
ad-compliance = "ad_compliance.cli:app"

[project.urls]
Homepage = "https://github.com/snikidev/llamaindex-python-rag"
Repository = "https://github.com/snikidev/llamaindex-python-rag"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ad_compliance"]

[tool.hatch.build.targets.wheel.force-include]
"data/Protecting-children-and-young-people-gambling-guidance-2022.pdf" = "ad_compliance/data/Protecting-children-and-young-people-gambling-guidance-2022.pdf"
"evals/snippets.json" = "ad_compliance/evals/snippets.json"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/ad_compliance/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
